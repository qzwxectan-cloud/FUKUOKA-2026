const budgetData=[

];

let currentDay=1;
const state={d3Plan:localStorage.getItem('fukuoka_d3_plan')||'single',todos:JSON.parse(localStorage.getItem('fukuoka_todos')||'{}')};
function tag(s){let normalized=s==='conditional'?'pending':s==='estimated'?'target':s==='fixed'?'confirmed':s==='dynamic'?'pending':s;return `<span class="tag ${normalized}">${STATUS[normalized]||s}</span>`}
function money(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function renderHeader(){document.getElementById('trip-title').textContent=tripData.title;document.getElementById('trip-meta').textContent=`${tripData.dateRange}｜${tripData.days}｜${tripData.travelers}人同行`;document.getElementById('last-updated').textContent='最後更新：'+tripData.lastUpdated}
function renderPills(){document.getElementById('day-pills').innerHTML=itineraryData.map(d=>`<div class="day-pill ${d.day===currentDay?'active':''}" data-day="${d.day}"><div class="n">${d.day}</div><div class="d">${d.date.slice(0,5)}</div></div>`).join('')}
function renderDay(){const d=itineraryData.find(x=>x.day===currentDay);document.getElementById('day-header').innerHTML=`<div class="date">DAY ${d.day}　${d.date}</div><div class="title">${d.title}</div><div class="chips">${d.highlights.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;document.getElementById('item-list').innerHTML=d.items.map(it=>`<div class="item"><div class="ico">${ICON[it.type]||'•'}</div><div class="main"><div class="time">${it.time}</div><div class="title-row"><span class="title">${it.title}</span>${it.status?tag(it.status):''}</div>${it.subtitle?`<div class="sub">${it.subtitle}</div>`:''}${it.notes?`<div class="note">${it.notes}</div>`:''}${it.location?`<div class="btns"><a class="btn primary" href="${mapUrl(it.location)}" target="_blank" rel="noopener">📍 導航</a></div>`:''}</div></div>`).join('')}
function d3Costs(){return state.d3Plan==='touch'?{pp:6400,total:12800,label:'Touch Kyushu 方案'}:{pp:6190,total:12380,label:'全部單買方案'}}
function renderWallet(){const d3=d3Costs();document.getElementById('ticket-wallet').innerHTML=`<div class="card wallet"><h3>TICKET WALLET</h3>${ticketData.map(t=>{let price=t.id==='d3touch'?(state.d3Plan==='touch'?5000:0):t.id==='d6'?(t.discountTarget*2):(t.pricePerPerson*t.quantity);return `<div class="ticket"><div class="ticket-top"><div class="ticket-name">D${t.day}｜${t.name}</div><div class="ticket-price">${price?money(price):'條件式'}</div></div><div class="ticket-meta">${t.purchaseDate||''}${t.purchaseDate?'｜':''}${t.notes||''}</div></div>`}).join('')}</div>`}
function renderStrategy(){document.getElementById('transport-strategy').innerHTML=`<div class="card"><h3>6天最省交通策略</h3><div class="strategy-grid"><div class="mini"><b>D1</b><span>不買 Pass，市區單次支付</span></div><div class="mini"><b>D2</b><span>太宰府・柳川観光きっぷ</span></div><div class="mini"><b>D3</b><span>${state.d3Plan==='touch'?'Touch Kyushu':'全部單買'}</span></div><div class="mini"><b>D4</b><span>不買 Pass</span></div><div class="mini"><b>D5</b><span>九州ネットきっぷ</span></div><div class="mini"><b>D6</b><span>ゆふいん号，早割優先</span></div></div></div>`}
function renderTransportDays(){document.getElementById('transport-days').innerHTML=transportationData.map(x=>`<div class="card"><div class="title-row"><h3 style="margin:0">D${x.day}｜${x.mode}</h3>${tag(x.status)}</div><div class="small" style="margin-top:7px">${x.origin} → ${x.destination}${x.farePerPerson?`｜約 ${money(x.farePerPerson)} / 人`:''}${x.regularPrice?`｜一般 ${money(x.regularPrice)} / 人`:''}${x.discountTarget?`｜優惠目標 ${money(x.discountTarget)} / 人`:''}</div>${x.paymentMethod?`<div class="small">付款：${x.paymentMethod}</div>`:''}</div>`).join('')}
function renderDecision(){const c=d3Costs();document.getElementById('d3-decision').innerHTML=`<div class="card decision"><h3>D3 Pass Decision</h3><div class="small">今天確定進小倉城嗎？若 15:00 後才離開門司港，建議取消小倉城，保留皿倉山夕陽與夜景。</div><div class="decision-actions"><button class="yes" data-plan="touch">YES｜去小倉城</button><button class="no" data-plan="single">NO｜不去</button></div><div class="decision-result">目前：<b>${c.label}</b><br>${money(c.pp)} / 人｜2人約 ${money(c.total)}</div></div>`}
function renderRules(){document.getElementById('rules').innerHTML=transportRules.map((r,i)=>`<div class="accordion"><button data-acc="${i}"><span>${r.title}</span><span>＋</span></button><div class="body">${r.body}</div></div>`).join('');document.getElementById('payment-card').innerHTML=`<div class="card"><h3>IC Card／付款方式</h3><div class="small"><b>Katrina</b>：沒有交通 IC。福岡地下鐵使用信用卡 Contactless；D2 用數位套票；D3 ふくふく号準備現金；D5 JR 網路購票；D6 高速巴士網路預約付款。<br><br><b>Stanley</b>：有 Suica 且有餘額。<br><br>一張交通 IC 原則上一人使用，不預設一張 Suica 可讓兩人同時過閘門。</div></div>`}
function renderStay(){document.getElementById('stay-list').innerHTML=hotelData.map(h=>`<div class="card hotel-card"><div class="title-row"><h3 style="margin:0">${h.name}</h3>${tag(h.status)}</div><div class="dates">${h.dates}</div><div class="addr">${h.address}</div><div class="small">早餐：${h.breakfast}｜晚餐：${h.dinner}｜Shuttle：${h.shuttle}</div><div class="btns"><a class="btn primary" href="${mapUrl(h.name+' '+h.address)}" target="_blank" rel="noopener">📍 導航</a></div></div>`).join('')}
function renderTodos(){document.getElementById('todo-list').innerHTML=todoData.map(g=>`<div class="check-group"><h3>${g.group}</h3><div class="card">${g.items.map(it=>`<label class="todo ${state.todos[it.id]?'done':''}"><input type="checkbox" data-todo="${it.id}" ${state.todos[it.id]?'checked':''}><span>${it.text}</span></label>`).join('')}</div></div>`).join('')}
function budgetCalc(){const d3=d3Costs().total;let estimated=0,regular=0,target=0;budgetData.forEach(b=>{if(b.dynamic==='d3'){estimated+=d3;regular+=d3;target+=d3;return}if(b.estimated){estimated+=b.estimated;regular+=b.estimated;target+=b.estimated}if(b.regularPrice){estimated+=b.regularPrice;regular+=b.regularPrice;target+=b.discountTarget||b.regularPrice}});return{estimated,regular,target}}
function renderBudget(){const b=budgetCalc();document.getElementById('budget-summary').innerHTML=`<div class="budget-summary"><div class="budget-box"><div class="k">目前預估</div><div class="v">${money(b.estimated)}</div></div><div class="budget-box"><div class="k">優惠後目標</div><div class="v">${money(b.target)}</div></div><div class="budget-box"><div class="k">已付款</div><div class="v">TBD</div></div><div class="budget-box"><div class="k">Taxi／臨時交通</div><div class="v">TBD</div></div></div><div class="note-box">目前僅計入已知交通與 OWL’S FOREST 門票。機票、住宿、餐飲與購物尚未填入實際金額時，不會虛構總預算。</div>`;document.getElementById('budget-detail').innerHTML=`<div class="card"><h3>目前已建資料</h3><div class="budget-list">${budgetData.map(x=>{let v=x.dynamic==='d3'?d3Costs().total:(x.estimated||x.regularPrice||0);let extra=x.discountTarget?`<span class="muted">優惠目標 ${money(x.discountTarget)}</span>`:'';return `<div class="budget-row"><div><b>${x.cat}</b><br><span class="muted">${x.name}</span></div><div style="text-align:right"><b>${money(v)}</b><br>${extra}</div></div>`}).join('')}</div></div>`}
function rerenderDynamic(){renderWallet();renderStrategy();renderDecision();renderBudget()}
renderHeader();renderPills();renderDay();renderWallet();renderStrategy();renderTransportDays();renderDecision();renderRules();renderStay();renderTodos();renderBudget();
document.getElementById('day-pills').addEventListener('click',e=>{const p=e.target.closest('.day-pill');if(!p)return;currentDay=Number(p.dataset.day);renderPills();renderDay();window.scrollTo({top:0,behavior:'smooth'})});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.view).classList.add('active');window.scrollTo(0,0)}));
document.getElementById('d3-decision').addEventListener('click',e=>{const b=e.target.closest('[data-plan]');if(!b)return;state.d3Plan=b.dataset.plan;localStorage.setItem('fukuoka_d3_plan',state.d3Plan);rerenderDynamic()});
document.getElementById('rules').addEventListener('click',e=>{const b=e.target.closest('button[data-acc]');if(!b)return;b.parentElement.classList.toggle('open');b.lastElementChild.textContent=b.parentElement.classList.contains('open')?'−':'＋'});
document.getElementById('todo-list').addEventListener('change',e=>{if(!e.target.matches('[data-todo]'))return;state.todos[e.target.dataset.todo]=e.target.checked;localStorage.setItem('fukuoka_todos',JSON.stringify(state.todos));renderTodos()});
</script>
