function renderTransportDays(){document.getElementById('transport-days').innerHTML=transportationData.map(x=>`<div class="card transport-card"><div class="title-row"><h3 style="margin:0">D${x.day}｜${x.mode}</h3>${tag(x.status)}</div><div class="small" style="margin-top:7px">${x.origin} → ${x.destination}${x.farePerPerson?`｜約 ${money(x.farePerPerson)} / 人`:''}${x.regularPrice?`｜${money(x.regularPrice)} / 人`:''}</div>${x.paymentMethod?`<div class="small">付款：${x.paymentMethod}</div>`:''}</div>`).join('')}
function renderDecision(){document.getElementById('d4-decision').innerHTML=`<div class="card decision"><h3>D4｜小倉城 Dynamic Add-on</h3><div class="small">小倉城已從主線降級，不需要出發前硬選。當天只看兩個條件。</div><div class="plan-rule"><b>≤ 14:15 離開門司港 ＋ 體力充足</b><br>可以考慮加碼小倉城。</div><div class="plan-rule"><b>超過 14:15 或想悠閒一點</b><br>直接前往八幡。皿倉山 Sunset → Blue Hour → Night View 永遠優先。</div></div>`}
function renderRules(){document.getElementById('rules').innerHTML=transportRules.map((r,i)=>`<div class="accordion"><button data-acc="${i}"><span>${r.title}</span><span>＋</span></button><div class="body">${r.body}</div></div>`).join('');document.getElementById('payment-card').innerHTML=`<div class="card"><h3>IC Card／付款方式</h3><div class="small"><b>Katrina</b>：沒有交通 IC。福岡地下鐵使用信用卡 Contactless；D2 用數位套票；D3 ふくふく号準備現金；D5 JR 網路購票；D6 高速巴士網路預約付款。<br><br><b>Stanley</b>：有 Suica 且有餘額。<br><br>一張交通 IC 原則上一人使用，不預設一張 Suica 可讓兩人同時過閘門。</div></div>`}
function renderStay(){document.getElementById('stay-list').innerHTML=hotelData.map(h=>`<div class="card hotel-card"><div class="title-row"><h3 style="margin:0">${h.name}</h3>${tag(h.status)}</div><div class="dates">${h.dates}</div><div class="addr">${h.address}</div><div class="small">早餐：${h.breakfast}｜晚餐：${h.dinner}｜Shuttle：${h.shuttle}</div><div class="btns"><a class="btn primary" href="${mapUrl(h.name+' '+h.address)}" target="_blank" rel="noopener">📍 導航</a></div></div>`).join('')}
function renderTodos(){document.getElementById('todo-list').innerHTML=todoData.map(g=>`<div class="check-group"><h3>${g.group}</h3><div class="card">${g.items.map(it=>`<div class="todo ${state.todos[it.id]?'done':''}"><input type="checkbox" data-todo="${it.id}" ${state.todos[it.id]?'checked':''}><span style="flex:1">${it.text}${it.url?`<br><a class="btn soft" style="margin-top:6px" href="${it.url}" target="_blank" rel="noopener">🎫 官方入口</a>`:''}</span></div>`).join('')}</div></div>`).join('')}
function budgetCalc(){let estimated=0;budgetData.forEach(b=>{estimated+=b.estimated||b.regularPrice||0});return{estimated}}
function renderBudget(){const b=budgetCalc();document.getElementById('budget-summary').innerHTML=`<div class="budget-summary"><div class="budget-box"><div class="k">目前已建預估</div><div class="v">${money(b.estimated)}</div></div><div class="budget-box"><div class="k">已付款</div><div class="v">TBD</div></div><div class="budget-box"><div class="k">Taxi / Backup</div><div class="v">TBD</div></div><div class="budget-box"><div class="k">2人旅行</div><div class="v">6D5N</div></div></div><div class="note-box">目前只計入已知交通、D5 行李配送估值、OWL’S FOREST 與椿入湯稅。未確認折扣不先灌進預算，避免「看起來很省、現場不是那個價」。</div>`;document.getElementById('budget-detail').innerHTML=`<div class="card"><h3>目前已建資料</h3><div class="budget-list">${budgetData.map(x=>{let v=x.estimated||x.regularPrice||0;return `<div class="budget-row"><div><b>${x.cat}</b><br><span class="muted">${x.name}</span></div><div style="text-align:right"><b>${money(v)}</b></div></div>`}).join('')}</div></div>`}
function rerenderDynamic(){renderWallet();renderStrategy();renderDecision();renderBudget()}
renderHeader();renderNow();renderPills();renderDay();renderWallet();renderStrategy();renderTransportDays();renderDecision();renderRules();renderStay();renderTodos();renderBudget();
document.getElementById('day-pills').addEventListener('click',e=>{const p=e.target.closest('.day-pill');if(!p)return;currentDay=Number(p.dataset.day);renderPills();renderDay();window.scrollTo({top:0,behavior:'smooth'})});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.view).classList.add('active');window.scrollTo(0,0)}));
document.getElementById('rules').addEventListener('click',e=>{const b=e.target.closest('button[data-acc]');if(!b)return;b.parentElement.classList.toggle('open');b.lastElementChild.textContent=b.parentElement.classList.contains('open')?'−':'＋'});
document.getElementById('todo-list').addEventListener('change',e=>{if(!e.target.matches('[data-todo]'))return;state.todos[e.target.dataset.todo]=e.target.checked;localStorage.setItem('fukuoka_todos',JSON.stringify(state.todos));renderTodos()});
</script>
</body>
</html>
