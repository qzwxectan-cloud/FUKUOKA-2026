<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#64313E">
<title>福岡秋日旅行</title>
<meta property="og:title" content="福岡秋日旅行">
<meta name="apple-mobile-web-app-title" content="福岡秋日旅行">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --wine:#64313E; --mist:#C1DBE8; --cream:#E1D5C5; --sage:#C7D9B7;
  --rose:#B77B83; --ink:#2F2628; --soft:#8A7B7D; --paper:#FFFDFB; --page:#F8F4F0;
  --line:#E9DED7; --yellow:#F2E7B5; --bluegray:#DCE4EA; --gray:#EDEBE9;
  --shadow:0 14px 34px -20px rgba(100,49,62,.26);
}
*{box-sizing:border-box} html,body{margin:0;padding:0} body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
button,a{font:inherit} #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--page);padding-bottom:84px}
.hero{
  position:relative;
  isolation:isolate;
  min-height:154px;
  padding:28px 22px 18px;
  color:#fff;
  background:#64313E;
  border-bottom:4px solid #C1DBE8;
  overflow:visible;
}
.hero.quick-open{z-index:70}
.hero-in{position:relative;z-index:3;max-width:330px;padding-right:76px}
.kicker{font-size:10px;letter-spacing:1.7px;opacity:.78;white-space:nowrap}
.hero h1{font-size:27px;line-height:1.12;margin:7px 0 8px;letter-spacing:.01em}
.meta{font-size:12px;line-height:1.45;opacity:.94;white-space:nowrap}
.updated{margin-top:6px;font-size:10px;opacity:.66;white-space:nowrap}
.hero-art{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.hero-tile{position:absolute;display:block;border-radius:28px;border:1px solid rgba(255,255,255,.06)}
.hero-tile-a{width:128px;height:128px;right:-48px;bottom:-56px;transform:rotate(18deg);background:rgba(193,219,232,.12);border:none}
.hero-tile-b{display:none}
.hero-stroke{position:absolute;width:78px;height:17px;border-radius:999px;right:19px;top:23px;transform:rotate(-8deg);background:rgba(225,213,197,.24)}
.view{display:none;padding:0 18px 8px}.view.active{display:block;animation:viewIn .28s ease both}@keyframes viewIn{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 12px}.section-title h2{margin:0;font-size:18px}.section-title span{font-size:10.5px;color:var(--wine);background:var(--mist);padding:5px 9px;border-radius:999px;font-weight:700}
.day-pills{display:flex;gap:9px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}.day-pills::-webkit-scrollbar{display:none}.day-pill{flex:0 0 58px;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:9px 0 7px;text-align:center;box-shadow:var(--shadow);cursor:pointer;scroll-snap-align:start;transition:transform .22s ease,background .22s ease,border-color .22s ease}.day-pill .n{font-weight:800}.day-pill .d{font-size:9.5px;color:var(--soft);margin-top:2px}.day-pill.active{background:var(--wine);border-color:var(--wine);color:#fff;transform:translateY(-1px)}.day-pill.active .d{color:#fff}
.day-header{margin:17px 2px 8px}.day-header .date{font-size:11px;color:var(--soft)}.day-header .title{font-size:18px;font-weight:800;margin-top:3px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:10.5px;padding:5px 9px;border-radius:999px;background:var(--cream);color:var(--wine);font-weight:700}.chip:nth-child(even){background:var(--mist)}
.item-list{margin-top:4px}.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:none}.ico{width:35px;height:35px;flex:0 0 35px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--mist),#EDF4F7);box-shadow:inset 0 0 0 1px rgba(100,49,62,.05)}.main{min-width:0;flex:1}.time{font-size:11px;color:var(--soft);font-weight:700;margin-bottom:2px}.title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.title{font-size:13.5px;font-weight:800;line-height:1.45}.sub,.note{font-size:11.5px;color:var(--soft);line-height:1.65;margin-top:4px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn{display:inline-flex;align-items:center;text-decoration:none;border:none;cursor:pointer;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800}.btn.primary{background:var(--wine);color:#fff}.btn.soft{background:var(--cream);color:var(--wine)}
.tag{font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:7px}.confirmed{background:var(--sage);color:#3F5D35}.target{background:#F2DFDF;color:#7F3444}.pending{background:var(--yellow);color:#7B671F}.optional{background:var(--gray);color:#6F6A68}.backup{background:var(--bluegray);color:#4F6272}.completed{background:#D9EAD2;color:#36552E}.skipped{background:#E9E7E5;color:#86807C;text-decoration:line-through}
.card{background:var(--paper);border:1px solid rgba(225,213,197,.92);border-radius:20px;padding:16px 17px;margin:0 2px 13px;box-shadow:var(--shadow)}.card h3{font-size:14px;margin:0 0 8px}.card .small{font-size:11.5px;line-height:1.7;color:var(--soft)}.card .strong{font-size:13px;font-weight:800;color:var(--wine)}.wallet{background:linear-gradient(145deg,var(--wine),#754651);color:#fff;border-color:rgba(193,219,232,.85);box-shadow:0 14px 30px -20px rgba(100,49,62,.45),inset 0 0 0 1px rgba(193,219,232,.16)}.wallet .ticket{padding:12px 0;border-top:1px solid rgba(255,255,255,.18)}.wallet .ticket:first-of-type{border-top:none}.ticket-top{display:flex;justify-content:space-between;gap:10px}.ticket-name{font-size:13px;font-weight:800}.ticket-price{font-size:13px;font-weight:800}.ticket-meta{font-size:10.5px;line-height:1.55;opacity:.82;margin-top:4px}
.strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:rgba(225,213,197,.38);border:1px solid rgba(225,213,197,.95);border-radius:14px;padding:11px}.mini:nth-child(2n){background:rgba(193,219,232,.42);border-color:rgba(193,219,232,.95)}.mini b{display:block;font-size:11px;color:var(--wine);margin-bottom:3px}.mini span{font-size:10.5px;color:var(--soft);line-height:1.5}
.decision{background:linear-gradient(145deg,rgba(225,213,197,.42),rgba(193,219,232,.32));border:1px solid rgba(193,219,232,.85)}.decision-actions{display:flex;gap:8px;margin-top:12px;padding:4px;border:1px solid rgba(100,49,62,.10);border-radius:999px;background:rgba(255,255,255,.62)}.decision-actions button{flex:1;border:none;border-radius:999px;padding:11px 9px;font-weight:800;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,color .2s ease}.decision-actions .yes,.decision-actions .no{background:transparent;color:var(--wine)}.decision-actions button.active{background:var(--wine);color:#fff;box-shadow:0 8px 18px -10px rgba(100,49,62,.58);transform:translateY(-1px)}.decision-result{margin-top:10px;padding:10px 11px;border-radius:12px;background:rgba(255,255,255,.82);border-left:4px solid var(--mist);font-size:11.5px;line-height:1.6}.journey-group{margin:0 0 14px;padding:15px 14px;border:1px solid rgba(100,49,62,.10);border-radius:18px;background:rgba(255,255,255,.62)}.journey-group .group-kicker{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--wine);margin-bottom:4px}.journey-group .group-title{font-size:17px;font-weight:900;margin-bottom:10px}.journey-step{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-top:1px solid rgba(100,49,62,.08)}.journey-step:first-of-type{border-top:none}.journey-step .step-time{font-size:10.5px;font-weight:800;color:#8B8280}.journey-step .step-main{font-size:12.5px;line-height:1.55}.journey-step .step-main b{font-size:13.5px}.journey-step .step-note{color:#8B8280;margin-top:2px}.decision-hint{margin-top:8px;font-size:10.5px;color:#7E7572}.decision .compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.decision .compare>div{padding:10px;border-radius:13px;background:rgba(255,255,255,.72);font-size:10.5px;line-height:1.5}.decision .compare b{display:block;font-size:12px;color:var(--wine);margin-bottom:3px}
.accordion{border:1px solid rgba(233,222,215,.78);border-radius:20px;background:rgba(255,253,251,.92);overflow:hidden;margin-bottom:10px;box-shadow:0 8px 24px -22px rgba(100,49,62,.28)}.accordion button{width:100%;border:none;background:none;padding:13px 14px;display:flex;justify-content:space-between;font-weight:800;color:var(--ink);cursor:pointer}.accordion .body{display:none;padding:0 14px 13px;font-size:11.5px;line-height:1.75;color:var(--soft)}.accordion.open .body{display:block;background:rgba(193,219,232,.20)}
.check-group{margin-bottom:16px}.check-group h3{font-size:13px;color:var(--wine);margin:0 2px 8px}.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.55}.todo input{margin-top:3px;accent-color:var(--wine)}.todo.done span{text-decoration:line-through;color:#9B9490}
.budget-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.budget-box{background:rgba(225,213,197,.32);border:1px solid rgba(225,213,197,.90);border-radius:14px;padding:12px}.budget-box:nth-child(2n){background:rgba(193,219,232,.34);border-color:rgba(193,219,232,.90)}.budget-box .k{font-size:10px;color:var(--soft)}.budget-box .v{font-size:17px;font-weight:850;color:var(--wine);margin-top:3px}.budget-list{margin-top:12px}.budget-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:11.5px}.budget-row b{font-size:12px}.muted{color:var(--soft)}
.transport-card{border-top:4px solid rgba(193,219,232,.82)}.hotel-card{border-top:4px solid rgba(225,213,197,.95)}.hotel-card .dates{font-size:11px;color:var(--soft);margin-bottom:6px}.addr{font-size:11.5px;color:var(--soft);padding-left:10px;border-left:4px solid var(--mist);line-height:1.65;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,253,251,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(7px + env(safe-area-inset-bottom));z-index:50}nav button{flex:1;border:none;background:none;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 2px;cursor:pointer}nav .ic{font-size:16px;padding:4px 9px;border-radius:9px}nav .lbl{font-size:9.5px;font-weight:800}nav button.active{color:var(--wine)}nav button.active .ic{background:var(--mist)}
.note-box{background:rgba(193,219,232,.28);border-radius:13px;padding:11px 13px;font-size:11px;line-height:1.7;color:var(--soft);margin:10px 2px 12px}
.now-card{margin:16px 2px 0;background:linear-gradient(145deg,rgba(193,219,232,.46),rgba(255,253,251,.94));border:1px solid rgba(193,219,232,.9);border-radius:20px;padding:14px 15px;box-shadow:var(--shadow)}.now-label{font-size:10px;font-weight:850;letter-spacing:.9px;color:var(--wine)}.now-main{font-size:14px;font-weight:850;margin-top:4px}.now-sub{font-size:11px;color:var(--soft);line-height:1.6;margin-top:4px}.status-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.link-btn{display:inline-flex;align-items:center;text-decoration:none;border-radius:999px;padding:6px 10px;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.26)}.item .link-btn{background:var(--mist);color:var(--wine);border:none}.pending-card{border-left:4px solid #E7C85B}.route{font-size:10.8px;color:var(--wine);font-weight:750;margin-top:5px}.plan-rule{margin-top:8px;padding:9px 10px;border-radius:11px;background:rgba(193,219,232,.28);font-size:11px;line-height:1.6}.ticket-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}

/* V5 LIVE MODE */
.live-card{margin:16px 2px 0;border-radius:22px;padding:16px;background:linear-gradient(150deg,#5a2a36 0%,#70404b 100%);color:#fff;box-shadow:0 18px 38px -22px rgba(100,49,62,.55);border:1px solid rgba(193,219,232,.45)}
.live-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.live-eyebrow{font-size:9.5px;letter-spacing:1.2px;font-weight:900;opacity:.72}.live-clock{font-size:10px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.13)}
.live-title{font-size:19px;font-weight:900;line-height:1.35;margin:8px 0 4px}.live-sub{font-size:11.5px;line-height:1.6;opacity:.84}.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.live-pane{padding:11px;border-radius:15px;background:rgba(255,255,255,.10);min-height:87px}.live-pane.next{background:rgba(193,219,232,.17)}.live-k{font-size:9px;font-weight:900;letter-spacing:.08em;opacity:.72}.live-v{font-size:12.5px;font-weight:850;line-height:1.45;margin-top:4px}.live-time{font-size:10.5px;opacity:.74;margin-top:4px}.live-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.live-btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.13);color:#fff;border-radius:999px;padding:8px 11px;font-size:10.5px;font-weight:850;text-decoration:none;cursor:pointer}.live-btn.main{background:#fff;color:var(--wine)}
.live-progress{height:5px;border-radius:999px;background:rgba(255,255,255,.14);margin-top:13px;overflow:hidden}.live-progress span{display:block;height:100%;border-radius:inherit;background:var(--mist);transition:width .35s ease}.live-foot{font-size:9.5px;opacity:.62;margin-top:7px}.pretrip-card{background:linear-gradient(145deg,rgba(193,219,232,.55),rgba(255,253,251,.96));color:var(--ink);border:1px solid rgba(193,219,232,.92)}.pretrip-card .live-eyebrow,.pretrip-card .live-sub,.pretrip-card .live-foot{color:var(--soft);opacity:1}.pretrip-card .live-clock{background:rgba(100,49,62,.08);color:var(--wine)}.pretrip-card .live-pane{background:rgba(255,255,255,.68)}.pretrip-card .live-btn{background:var(--wine);color:#fff;border:none}.pretrip-card .live-btn.main{background:var(--wine);color:#fff}.pretrip-card .live-progress{background:rgba(100,49,62,.10)}
.journey-group.live-active{border-color:rgba(100,49,62,.38);box-shadow:0 12px 28px -22px rgba(100,49,62,.5);background:rgba(255,253,251,.94)}.journey-group.done-group{opacity:.66}.journey-step.done-step .step-main{text-decoration:line-through;text-decoration-thickness:1px;color:#978c89}.journey-step.current-step{background:rgba(193,219,232,.25);margin:0 -8px;padding:10px 8px;border-radius:11px}.step-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.mini-action{border:none;border-radius:999px;padding:6px 9px;background:var(--cream);color:var(--wine);font-size:9.5px;font-weight:850;cursor:pointer;text-decoration:none}.mini-action.done{background:var(--sage);color:#3F5D35}
.day-decision{margin-top:16px}.day-decision .deadline{display:inline-flex;margin-bottom:8px;padding:5px 8px;border-radius:999px;background:var(--yellow);color:#705e20;font-size:9.5px;font-weight:850}.day-decision h3{font-size:16px;margin-bottom:6px}.day-decision .decision-actions{margin-top:10px}.day-decision .decision-result{border-left-color:var(--wine)}
.shuttle-wait{border-left:4px solid #E7C85B;background:linear-gradient(145deg,rgba(242,231,181,.38),rgba(255,253,251,.95));padding:11px;border-radius:12px;margin-top:8px}.shuttle-wait b{color:#6E5A1B}.journey-note{font-size:10.5px;line-height:1.6;color:var(--soft);margin-top:7px;padding:8px 9px;background:rgba(193,219,232,.18);border-radius:10px}
@media(min-width:700px){body{padding:24px 0}#app{border-radius:24px;overflow:hidden;box-shadow:0 20px 70px rgba(100,49,62,.12)}}

/* ===== V7 CLOUD ===== */
#app{padding-bottom:104px}.cloud-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px 0;padding:9px 12px;border:1px solid rgba(100,49,62,.10);border-radius:14px;background:rgba(255,253,251,.78);font-size:10.5px;color:var(--soft)}.cloud-strip b{color:var(--wine)}.cloud-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:#C7D9B7}.cloud-dot.off{background:#D7B4B4}.cloud-dot.wait{background:#E1D5C5}.identity-btn{border:0;background:var(--mist);color:var(--wine);font-weight:850;border-radius:999px;padding:6px 9px;cursor:pointer}.today-wallet{margin-top:13px}.today-wallet .wallet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.today-wallet .wallet-head span{font-size:9px;letter-spacing:.12em;opacity:.72}.today-wallet .ticket{padding:10px 0}.fab-wrap{
  position:absolute;
  z-index:10;
  right:20px;
  bottom:17px;
  width:54px;
  height:54px;
  pointer-events:none;
}
.fab{
  position:absolute;inset:0;width:54px;height:54px;
  border:none;border-radius:17px;background:#C1DBE8;color:#64313E;
  box-shadow:0 14px 28px -16px rgba(24,22,23,.48);
  display:grid;place-items:center;font-size:29px;line-height:1;
  cursor:pointer;pointer-events:auto;transform:rotate(9deg);
  transition:transform .30s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease;
}
.fab::before{content:none}
.fab span{display:block;transform:rotate(-9deg) translateY(-1px);transition:transform .30s cubic-bezier(.2,.8,.2,1)}
.fab:active{transform:rotate(9deg) scale(.95)}
.fab-wrap.open .fab{transform:rotate(0deg);box-shadow:0 15px 30px -16px rgba(24,22,23,.55),0 0 0 7px rgba(193,219,232,.11)}
.fab-wrap.open .fab span{transform:rotate(45deg)}

.fab-actions{position:absolute;inset:0;pointer-events:none}
.fab-action{
  position:absolute;right:2px;bottom:2px;width:50px;height:50px;padding:0;border:0;background:none;
  opacity:0;pointer-events:none;transform:translate(0,0) scale(.45);
  transition:opacity .16s ease,transform .34s cubic-bezier(.18,.86,.24,1);cursor:pointer;
}
.fab-action-icon{
  position:absolute;inset:0;display:grid;place-items:center;width:50px;height:50px;border-radius:50%;
  background:rgba(255,253,251,.97);border:1px solid rgba(193,219,232,.78);color:#64313E;
  box-shadow:0 12px 25px -16px rgba(47,38,40,.52);font-size:17px;
}
.fab-action-label{
  position:absolute;left:50%;top:54px;transform:translateX(-50%);min-width:42px;padding:3px 6px;
  border-radius:999px;background:#64313E;color:#fff;font-size:8px;font-weight:800;line-height:1.15;
  white-space:nowrap;box-shadow:0 7px 15px -12px rgba(47,38,40,.55);
}
.fab-wrap.open .fab-actions{pointer-events:auto}
.fab-wrap.open .fab-action{opacity:1;pointer-events:auto}
.fab-wrap.open .action-expense{transform:translate(-108px,5px) scale(1);transition-delay:.02s}
.fab-wrap.open .action-todo{transform:translate(-76px,-76px) scale(1);transition-delay:.06s}

.fab-scrim{position:fixed;inset:0;z-index:69;background:rgba(47,38,40,.035);opacity:0;pointer-events:none;transition:opacity .18s ease}
.fab-scrim.open{opacity:1;pointer-events:auto}

@media(max-width:380px){
  .hero{padding-left:18px;padding-right:18px}
  .hero-in{padding-right:68px}
  .hero h1{font-size:25px}
  .meta{font-size:11.2px}
  .fab-wrap{right:17px}
  .fab-wrap.open .action-expense{transform:translate(-108px,5px) scale(1);transition-delay:.02s}
.fab-wrap.open .action-todo{transform:translate(-76px,-76px) scale(1);transition-delay:.06s}
}

/* Floating action button: lower-right, away from the FUKUOKA header */
.fab-wrap{
  position:fixed !important;
  right:max(18px, calc((100vw - 480px)/2 + 18px)) !important;
  bottom:calc(94px + env(safe-area-inset-bottom)) !important;
  top:auto !important;
  width:52px !important;
  height:52px !important;
  z-index:76 !important;
  pointer-events:none;
}
.fab{
  position:absolute !important;
  inset:0 !important;
  width:52px !important;
  height:52px !important;
  border:0 !important;
  border-radius:17px !important;
  background:#C1DBE8 !important;
  color:#64313E !important;
  box-shadow:0 12px 24px -14px rgba(47,38,40,.40) !important;
  display:grid !important;
  place-items:center !important;
  font-size:27px !important;
  line-height:1 !important;
  cursor:pointer !important;
  pointer-events:auto !important;
  transform:rotate(8deg) !important;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease !important;
}
.fab span{
  display:block !important;
  transform:rotate(-8deg) translateY(-1px) !important;
  transition:transform .28s cubic-bezier(.2,.8,.2,1) !important;
}
.fab:active{transform:rotate(8deg) scale(.95) !important}
.fab-wrap.open .fab{
  transform:rotate(0deg) !important;
  box-shadow:0 14px 28px -15px rgba(47,38,40,.46) !important;
}
.fab-wrap.open .fab span{transform:rotate(45deg) !important}

/* Actions open upward / upper-left so they don't cover the bottom nav */
.fab-action{
  width:46px !important;
  height:46px !important;
  right:3px !important;
  bottom:3px !important;
}
.fab-action-icon{
  width:46px !important;
  height:46px !important;
  border-radius:50% !important;
  font-size:16px !important;
}
.fab-action-label{top:auto !important;bottom:50px !important}
.fab-wrap.open .action-expense{
  transform:translate(-72px,-8px) scale(1) !important;
}
.fab-wrap.open .action-todo{
  transform:translate(-30px,-70px) scale(1) !important;
}

@media(max-width:380px){
  .hero::before{inset:12px 12px}
  .fab-wrap{
    right:14px !important;
    bottom:calc(90px + env(safe-area-inset-bottom)) !important;
  }
  .fab-wrap.open .action-expense{transform:translate(-66px,-7px) scale(1) !important}
  .fab-wrap.open .action-todo{transform:translate(-28px,-65px) scale(1) !important}
}
</style>


<style id="fab-click-fix">
/* Fixed FAB must sit above the full-screen scrim (scrim z-index is 69). */
.fab-wrap{z-index:71 !important;pointer-events:none !important}
.fab-wrap .fab{pointer-events:auto !important}
.fab-wrap.open{z-index:71 !important}
.fab-wrap.open .fab-action{pointer-events:auto !important}
</style>


<style id="fab-root-layer-fix">
#fab-wrap{
  position:fixed !important;
  z-index:100 !important;
  pointer-events:none !important;
}
#fab-wrap .fab{pointer-events:auto !important}
#fab-wrap.open .fab-action{pointer-events:auto !important}
#fab-scrim{z-index:99 !important}
nav{z-index:50 !important}
</style>


<style id="editable-trip-v4">
/* V4 Editable Trip · V5: keep existing visual language, add lightweight edit affordances */
.journey-step.editable-step{position:relative;cursor:pointer;border-radius:12px;transition:background .18s ease}
.journey-step.editable-step:active{background:rgba(193,219,232,.22)}
.journey-step .edit-hint{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:3px 7px;border:0;border-radius:999px;background:rgba(193,219,232,.42);color:var(--wine);font-size:8.8px;font-weight:850;cursor:pointer;vertical-align:middle}
.journey-step .step-status{margin-top:5px}
.edit-sheet-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.edit-sheet-title .day-badge{font-size:9.5px;font-weight:900;color:var(--wine);background:var(--mist);padding:5px 8px;border-radius:999px;white-space:nowrap}
.form-row textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;color:var(--ink);line-height:1.5}
.form-row .field-help{font-size:9.5px;color:var(--soft);line-height:1.5;margin-top:4px}
.reset-btn{width:100%;margin-top:8px;border:0;background:transparent;color:var(--soft);font-size:10.5px;font-weight:800;padding:8px;cursor:pointer}
.edit-sync-note{margin-top:9px;padding:9px 10px;border-radius:11px;background:rgba(193,219,232,.22);font-size:10px;line-height:1.55;color:var(--soft)}
@media(hover:hover){.journey-step.editable-step:hover{background:rgba(193,219,232,.13)}}

/* V5 Itinerary Manager: add / delete with a polished mobile planner UI */
.day-planner{margin:2px 0 14px;padding:13px 14px;border:1px solid rgba(100,49,62,.10);border-radius:18px;background:linear-gradient(135deg,rgba(255,253,251,.96),rgba(193,219,232,.16));box-shadow:0 12px 28px -24px rgba(47,38,40,.45)}
.day-planner-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-planner-copy{min-width:0}.day-planner-kicker{font-size:8.5px;letter-spacing:.14em;font-weight:900;color:var(--soft)}.day-planner-title{font-size:12.5px;font-weight:900;color:var(--ink);margin-top:2px}.day-planner-sub{font-size:9.5px;color:var(--soft);margin-top:3px;line-height:1.45}
.add-trip-btn{flex:0 0 auto;border:0;border-radius:999px;background:var(--wine);color:#fff;padding:9px 12px;font-size:10.5px;font-weight:900;box-shadow:0 8px 18px -12px rgba(100,49,62,.65);cursor:pointer}.add-trip-btn span{font-size:14px;vertical-align:-1px;margin-right:3px}
.deleted-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;border:0;background:transparent;color:var(--soft);font-size:9.5px;font-weight:800;padding:0;cursor:pointer}
.journey-step.custom-step{background:rgba(193,219,232,.10)}.custom-badge{display:inline-flex;align-items:center;margin-left:6px;padding:2px 6px;border-radius:999px;background:rgba(100,49,62,.08);color:var(--wine);font-size:7.8px;font-weight:900;letter-spacing:.08em;vertical-align:middle}
.manage-sheet-hero{margin:-2px 0 13px;padding:14px;border-radius:17px;background:linear-gradient(135deg,rgba(193,219,232,.28),rgba(225,213,197,.30));border:1px solid rgba(100,49,62,.08)}.manage-sheet-hero .eyebrow{font-size:8.5px;letter-spacing:.14em;font-weight:900;color:var(--wine)}.manage-sheet-hero h3{margin:3px 0 2px;font-size:18px}.manage-sheet-hero p{margin:0;font-size:10px;color:var(--soft);line-height:1.5}
.form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-row.two>div{min-width:0}.form-row.two label{display:block}
.danger-zone{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(100,49,62,.16)}.danger-btn{width:100%;border:0;border-radius:999px;padding:10px 12px;background:rgba(100,49,62,.07);color:var(--wine);font-size:10.5px;font-weight:900;cursor:pointer}.danger-btn.confirming{background:var(--wine);color:#fff}.danger-help{text-align:center;font-size:9px;color:var(--soft);margin-top:5px}
.deleted-list{display:grid;gap:8px;margin-top:12px}.deleted-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:#fff}.deleted-item .meta{min-width:0;flex:1}.deleted-item b{display:block;font-size:11.5px}.deleted-item span{display:block;font-size:9.5px;color:var(--soft);margin-top:2px}.restore-btn{border:0;border-radius:999px;background:var(--mist);color:var(--wine);padding:7px 9px;font-size:9.5px;font-weight:900;cursor:pointer}
</style>

</head>

 openSheet(`<div class="manage-sheet-hero"><div class="eyebrow">DAY ${day} · ADD JOURNEY</div><h3>新增一站</h3><p>選一個旅程段落，把新的餐廳、景點或移動塞進去。</p></div><div class="form-row"><label>放在哪一段</label><select id="new-group">${groupOptions(day,Math.max(groups.length-1,0))}</select></div><div class="form-row two"><div><label>時間</label><input id="new-time" placeholder="例如 15:30"></div><div><label>狀態</label><select id="new-status">${statusOptions('target')}</select></div></div><div class="form-row"><label>標題</label><input id="new-title" placeholder="新增的景點、餐廳或移動"></div><div class="form-row"><label>備註</label><textarea id="new-note" placeholder="訂位資訊、交通提醒、集合點…"></textarea></div><div class="form-row"><label>導航地點 <span style="font-weight:600;opacity:.7">選填</span></label><input id="new-location" placeholder="輸入 Google Maps 可搜尋的地點"></div><div class="form-actions"><button class="cancel-btn" data-close-sheet>取消</button><button class="save-btn" data-add-itinerary="${day}">＋ 新增並同步</button></div><div class="edit-sync-note">新增後會出現在你選的 Journey 區段最後一筆。</div>`)
}
function deletedItemsForDay(day){const out=[];const groups=groupsForDay(day);groups.forEach((g,gi)=>g.steps.forEach((base,si)=>{const id=stepKey(day,gi,si,base);if(state.itineraryDeleted[id])out.push({id,title:(state.itineraryEdits[id]?.title||base.title),time:(state.itineraryEdits[id]?.time||base.time||''),group:g.title})}));state.itineraryCustom.filter(x=>Number(x.day)===Number(day)&&state.itineraryDeleted[x.id]).forEach(x=>out.push({id:x.id,title:x.title,time:x.time||'',group:(groups[Number(x.groupIndex)]||{}).title||'自訂行程'}));return out}
function deletedItinerarySheet(day=currentDay){const items=deletedItemsForDay(day);openSheet(`<div class="manage-sheet-hero"><div class="eyebrow">DAY ${day} · ARCHIVE</div><h3>已刪除行程</h3><p>刪除不是碎紙機。需要時可以把它們放回旅程。</p></div>${items.length?`<div class="deleted-list">${items.map(x=>`<div class="deleted-item"><div class="meta"><b>${escapeHtml(x.title)}</b><span>${escapeHtml(x.time)} · ${escapeHtml(x.group)}</span></div><button class="restore-btn" data-restore-itinerary="${x.id}" data-edit-day="${day}">還原</button></div>`).join('')}</div>`:`<div class="edit-sync-note">目前沒有已刪除的行程。</div>`}<div class="form-actions"><button class="cancel-btn" data-close-sheet>完成</button></div>`)}
function escapeHtml(v=''){return String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function escapeAttr(v=''){return escapeHtml(v).replace(/"/g,'&quot;')}
function renderPlannerBar(day){const count=deletedItemsForDay(day).length;return `<div class="day-planner"><div class="day-planner-top"><div class="day-planner-copy"><div class="day-planner-kicker">DAY ${day} · JOURNEY EDITOR</div><div class="day-planner-title">今天想再加一站？</div><div class="day-planner-sub">新增、編輯、刪除都會同步，不必再改 HTML。</div></div><button class="add-trip-btn" data-add-trip="${day}"><span>＋</span>新增行程</button></div>${count?`<button class="deleted-link" data-show-deleted="${day}">↺ ${count} 筆已刪除行程可還原</button>`:''}</div>`}
function renderJourney(groups,day=currentDay){return groups.map((g,gi)=>{const baseSteps=g.steps.map((base,si)=>({base,si,isCustom:false})),customSteps=customForGroup(day,gi).map((base,idx)=>({base,si:10000+idx,isCustom:true}));const rows=[...baseSteps,...customSteps].filter(x=>{const id=x.isCustom?x.base.id:stepKey(day,gi,x.si,x.base);return !state.itineraryDeleted[id]});return `<div class="journey-group"><div class="group-kicker">${g.label}</div><div class="group-title">${g.title}</div>${rows.map(({base,si,isCustom})=>{const st=editedStep(day,gi,si,base);return `<div class="journey-step editable-step ${isCustom?'custom-step':''}" data-edit-step="${st.id}" data-edit-day="${day}"><div class="step-time">${escapeHtml(st.time||'')}</div><div class="step-main"><b>${escapeHtml(st.title||'')}</b>${isCustom?'<span class="custom-badge">ADDED</span>':''}<button class="edit-hint" data-edit-itinerary="${st.id}" data-edit-day="${day}" aria-label="編輯這筆行程">✎ 編輯</button>${st.note?`<div class="step-note">${escapeHtml(st.note)}</div>`:''}${st.status?`<div class="step-status">${tag(st.status)}</div>`:''}${st.id==='d5-shuttle'?`<div class="shuttle-wait"><b>SHUTTLE REQUESTED</b><br>${escapeHtml(st.time||'19:00')}｜由布院站 → 椿<br><span class="muted">等待飯店確認</span></div>`:''}${st.id==='d6-shuttle'?`<div class="shuttle-wait"><b>SHUTTLE REQUESTED</b><br>${escapeHtml(st.time||'10:15')}｜椿 → 由布院站／Bus Center<br><span class="muted">等待飯店確認</span></div>`:''}<div class="step-actions">${st.location?`<a class="mini-action" href="${mapUrl(st.location)}" target="_blank" rel="noopener">📍 導航</a>`:''}<button class="mini-action ${state.stepDone[st.id]?'done':''}" data-step-done="${st.id}">${state.stepDone[st.id]?'✓ 已完成':'完成'}</button></div></div></div>`}).join('')}</div>`}).join('')}
function renderInlineTools(){const el=document.getElementById('day-inline-tools');if(currentDay!==3){el.innerHTML='';return}const label=state.castle==='yes'?'小倉城版｜買 Touch Kyushu':state.castle==='no'?'門司港悠閒版｜單買':'尚未選擇';el.innerHTML=`<div class="card decision day-decision"><div class="deadline">10/10 晚上</div><h3>D4 版本</h3><div class="decision-actions"><button class="yes ${state.castle==='yes'?'active':''}" data-castle="yes">🏯 小倉城版</button><button class="no ${state.castle==='no'?'active':''}" data-castle="no">🌇 悠閒版</button></div><div class="decision-result"><b>${label}</b>${state.castle==='undecided'?'<br>會同步 D4 行程、票券與預算。':''}</div></div>`}
function renderDay(){const d=itineraryData.find(x=>x.day===currentDay);let dayTitle=d.title,highlights=[...d.highlights];if(d.day===4&&state.castle==='yes'){dayTitle='下關・門司港・小倉城・皿倉山';highlights=['Touch Kyushu','小倉城','皿倉山夜景']}else if(d.day===4&&state.castle==='no'){dayTitle='下關・門司港・皿倉山';highlights=['門司港悠閒版','單買','皿倉山夜景']}document.getElementById('day-header').innerHTML=`<div class="date">DAY ${d.day}　${d.date}</div><div class="title">${dayTitle}</div><div class="chips">${highlights.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;let html='';if(d.day===1)html=renderJourney(d1Groups,1);else if(d.day===2)html=renderJourney(d2Groups,2);else if(d.day===3)html=renderJourney(d3Groups,3);else if(d.day===4)html=renderJourney(d4Groups(),4);else if(d.day===5)html=renderJourney(d5Groups,5);else if(d.day===6)html=renderJourney(d6Groups,6);else html=d.items.map(it=>`<div class="item"><div class="ico">${ICON[it.type]||'•'}</div><div class="main"><div class="time">${it.time}</div><div class="title-row"><span class="title">${it.title}</span>${it.status?tag(it.status):''}</div>${it.subtitle?`<div class="sub">${it.subtitle}</div>`:''}${it.route?`<div class="route">${it.route}</div>`:''}${it.notes?`<div class="note">${it.notes}</div>`:''}${it.location?`<div class="btns"><a class="btn primary" href="${mapUrl(it.location)}" target="_blank" rel="noopener">📍 導航</a></div>`:''}</div></div>`).join('');document.getElementById('item-list').innerHTML=renderPlannerBar(d.day)+html;renderInlineTools()}
function renderWallet(){let tickets=[...ticketData];if(state.castle==='yes')tickets.splice(1,0,{day:4,name:'北九州周遊PASS～Touch Kyushu～｜1日券',pricePerPerson:2500,quantity:2,purchaseUrl:'https://kitakyushu-tourpass.com/zh-tw/',notes:'小倉城版｜JR＋指定設施＋皿倉山纜車'});document.getElementById('ticket-wallet').innerHTML=`<div class="card wallet"><h3>TICKET WALLET</h3>${tickets.map(t=>{let price=t.regularPrice?t.regularPrice*t.quantity:t.pricePerPerson*t.quantity;return `<div class="ticket"><div class="ticket-top"><div class="ticket-name">D${t.day}｜${t.name}</div><div class="ticket-price">${money(price)}</div></div><div class="ticket-meta">${t.purchaseDate||''}${t.purchaseDate?'｜':''}${t.notes||''}</div>${t.purchaseUrl?`<div class="ticket-actions"><a class="link-btn" href="${t.purchaseUrl}" target="_blank" rel="noopener">🎫 官方購票</a></div>`:''}</div>`}).join('')}</div>`}
function renderStrategy(){document.getElementById('transport-strategy').innerHTML=`<div class="card"><h3>6天交通策略</h3><div class="strategy-grid"><div class="mini"><b>D1</b><span>單次支付｜機場→祇園</span></div><div class="mini"><b>D2</b><span>太宰府・柳川観光きっぷ</span></div><div class="mini"><b>D3</b><span>購物日｜少量市區交通</span></div><div class="mini"><b>D4</b><span>${state.castle==='yes'?'Touch Kyushu＋小倉城':state.castle==='no'?'單買｜不去小倉城':'10/10 晚上選版本'}</span></div><div class="mini"><b>D5</b><span>由布院之森＋行李配送</span></div><div class="mini"><b>D6</b><span>12:00 ゆふいん号</span></div></div></div>`}
function renderTransportDays(){document.getElementById('transport-days').innerHTML=transportationData.map(x=>{let mode=x.mode,dest=x.destination;if(x.day===4&&state.castle==='yes'){mode='ふくふく号＋船＋Touch Kyushu';dest='唐戶・門司港・小倉・皿倉山'}else if(x.day===4&&state.castle==='no'){mode='ふくふく号＋船＋JR＋皿倉山';dest='唐戶・門司港・八幡・博多'}return `<div class="card transport-card"><div class="title-row"><h3 style="margin:0">D${x.day}｜${mode}</h3>${tag(x.status)}</div><div class="small" style="margin-top:7px">${x.origin} → ${dest}${x.farePerPerson?`｜約 ${money(x.farePerPerson)} / 人`:''}${x.regularPrice?`｜${money(x.regularPrice)} / 人`:''}</div>${x.paymentMethod?`<div class="small">${x.paymentMethod}</div>`:''}</div>`}).join('')}
function renderDecision(){const label=state.castle==='yes'?'小倉城版｜Touch Kyushu':state.castle==='no'?'門司港悠閒版｜單買':'尚未選擇';document.getElementById('d4-decision').innerHTML=`<div class="card decision"><h3>D4｜前一晚選版本</h3><div class="compare"><div><b>小倉城版</b>門司港 13:35 離開<br>14:05–15:05 小倉城<br>Touch Kyushu ¥2,500 / 人</div><div><b>悠閒版</b>門司港至 14:30<br>直接前往八幡<br>交通／門票單買</div></div><div class="decision-actions"><button class="yes ${state.castle==='yes'?'active':''}" data-castle="yes">🏯 小倉城版</button><button class="no ${state.castle==='no'?'active':''}" data-castle="no">🌇 悠閒版</button></div><div class="decision-result"><b>${label}</b></div></div>`}
function renderRules(){document.getElementById('rules').innerHTML=transportRules.map((r,i)=>`<div class="accordion"><button data-acc="${i}"><span>${r.title}</span><span>＋</span></button><div class="body">${r.body}</div></div>`).join('');document.getElementById('payment-card').innerHTML=`<div class="card"><h3>IC Card／付款方式</h3><div class="small"><b>Katrina</b>：地鐵 Contactless；D2 數位套票；D4 ふくふく号現金；D5/D6 網路購票。<br><br><b>Stanley</b>：Suica。<br><br>交通 IC 一人一張。</div></div>`}
function renderStay(){document.getElementById('stay-list').innerHTML=hotelData.map(h=>`<div class="card hotel-card"><div class="title-row"><h3 style="margin:0">${h.name}</h3>${tag(h.status)}</div><div class="dates">${h.dates}</div><div class="addr">${h.address}</div><div class="small">早餐：${h.breakfast}｜晚餐：${h.dinner}｜Shuttle：${h.shuttle}</div><div class="btns"><a class="btn primary" href="${mapUrl(h.name+' '+h.address)}" target="_blank" rel="noopener">📍 導航</a></div></div>`).join('')}
function renderTodos(){document.getElementById('todo-list').innerHTML=todoData.map(g=>`<div class="check-group"><h3>${g.group}</h3><div class="card">${g.items.map(it=>`<div class="todo ${state.todos[it.id]?'done':''}"><input type="checkbox" data-todo="${it.id}" ${state.todos[it.id]?'checked':''}><span style="flex:1">${it.text}${it.url?`<br><a class="btn soft" style="margin-top:6px" href="${it.url}" target="_blank" rel="noopener">🎫 官方入口</a>`:''}</span></div>`).join('')}</div></div>`).join('')}
function budgetCalc(){let estimated=0;budgetData.forEach(b=>{if(b.name==='D4 下關・門司港・皿倉山'){estimated+=state.castle==='yes'?12800:12380}else estimated+=b.estimated||b.regularPrice||0});return{estimated}}
function renderBudget(){const b=budgetCalc();document.getElementById('budget-summary').innerHTML=`<div class="budget-summary"><div class="budget-box"><div class="k">目前已建預估</div><div class="v">${money(b.estimated)}</div></div><div class="budget-box"><div class="k">已付款</div><div class="v">TBD</div></div><div class="budget-box"><div class="k">Taxi / Backup</div><div class="v">TBD</div></div><div class="budget-box"><div class="k">2人旅行</div><div class="v">6D5N</div></div></div><div class="note-box">僅計已知交通、行李、OWL’S FOREST 與入湯稅；未確認折扣不計。</div>`;document.getElementById('budget-detail').innerHTML=`<div class="card"><h3>目前已建資料</h3><div class="budget-list">${budgetData.map(x=>{let v=x.name==='D4 下關・門司港・皿倉山'?(state.castle==='yes'?12800:12380):(x.estimated||x.regularPrice||0);return `<div class="budget-row"><div><b>${x.cat}</b><br><span class="muted">${x.name}</span></div><div style="text-align:right"><b>${money(v)}</b></div></div>`}).join('')}</div></div>`}
function rerenderDynamic(){renderWallet();renderTodayWallet();renderStrategy();renderTransportDays();renderDecision();renderBudget();renderExpenses();renderNow();renderDay()}
renderHeader();renderCloudStatus();renderNow();renderTodayWallet();renderPills();renderDay();renderWallet();renderStrategy();renderTransportDays();renderDecision();renderRules();renderStay();renderTodos();renderBudget();renderExpenses();initCloud();
document.getElementById('day-pills').addEventListener('click',e=>{const p=e.target.closest('.day-pill');if(!p)return;currentDay=Number(p.dataset.day);closeQuick();renderPills();renderDay();renderTodayWallet();window.scrollTo({top:0,behavior:'smooth'})});
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));closeQuick();btn.classList.add('active');document.getElementById(btn.dataset.view).classList.add('active');window.scrollTo(0,0)}));
document.addEventListener('click',e=>{const addTrip=e.target.closest('[data-add-trip]');if(addTrip){addItineraryForm(Number(addTrip.dataset.addTrip)||currentDay);return}const showDeleted=e.target.closest('[data-show-deleted]');if(showDeleted){deletedItinerarySheet(Number(showDeleted.dataset.showDeleted)||currentDay);return}const editBtn=e.target.closest('[data-edit-itinerary]');if(editBtn){e.preventDefault();e.stopPropagation();editItineraryForm(editBtn.dataset.editItinerary,Number(editBtn.dataset.editDay)||currentDay);return}const editable=e.target.closest('.journey-step[data-edit-step]');if(editable&&!e.target.closest('a,button,input,select,textarea')){editItineraryForm(editable.dataset.editStep,Number(editable.dataset.editDay)||currentDay);return}const castle=e.target.closest('[data-castle]');if(castle){state.castle=castle.dataset.castle;pushShared();rerenderDynamic();return}const live=e.target.closest('[data-live-done]');if(live){const id=live.dataset.liveDone;state.liveDone[id]=!state.liveDone[id];pushShared();renderNow();return}const step=e.target.closest('[data-step-done]');if(step){const id=step.dataset.stepDone;state.stepDone[id]=!state.stepDone[id];pushShared();renderDay();return}if(e.target.closest('[data-go-prep]')){document.querySelector('[data-view="view-prep"]').click();return}if(e.target.closest('[data-go-ticket]')){document.querySelector('[data-view="view-transport"]').click();setTimeout(()=>document.getElementById('ticket-wallet').scrollIntoView({behavior:'smooth',block:'start'}),80);return}if(e.target.closest('[data-jump-today]')){document.querySelector('[data-view="view-itinerary"]').click();renderPills();renderDay();document.getElementById('day-header').scrollIntoView({behavior:'smooth',block:'start'});return}});
document.getElementById('rules').addEventListener('click',e=>{const b=e.target.closest('button[data-acc]');if(!b)return;b.parentElement.classList.toggle('open');b.lastElementChild.textContent=b.parentElement.classList.contains('open')?'−':'＋'});
document.getElementById('todo-list').addEventListener('change',e=>{if(!e.target.matches('[data-todo]'))return;state.todos[e.target.dataset.todo]=e.target.checked;pushShared();renderTodos();renderNow()});
document.getElementById('fab').addEventListener('click',(e)=>{
  e.preventDefault();
  e.stopPropagation();
  openQuick();
});document.getElementById('fab-scrim').addEventListener('click',closeQuick);document.getElementById('sheet-backdrop').addEventListener('click',closeSheet);
document.addEventListener('click',async e=>{if(e.target.closest('[data-identity]')){identitySheet();return}if(e.target.closest('[data-close-sheet]')){closeSheet();return}const qa=e.target.closest('[data-qa]');if(qa){closeQuick();const a=qa.dataset.qa;if(a==='expense')expenseForm();if(a==='todo')todoForm();if(a==='identity')identitySheet();if(a==='ticket'){closeSheet();document.querySelector('[data-view="view-itinerary"]').click();renderTodayWallet();document.getElementById('today-wallet').scrollIntoView({behavior:'smooth',block:'center'})}if(a==='navigate'){closeSheet();const day=tripDayFromDate(new Date())||currentDay,ls=liveState(day,new Date()),dest=ls.next?.location||ls.current?.location;if(dest)window.open(mapUrl(dest),'_blank')}if(a==='complete'){closeSheet();const day=tripDayFromDate(new Date())||currentDay,ls=liveState(day,new Date()),cur=ls.current;if(cur){state.liveDone[cur.id]=true;pushShared();renderNow();toast('已完成 · '+cur.title)}}return}const who=e.target.closest('[data-set-identity]');if(who){state.identity=who.dataset.setIdentity;localStorage.setItem('fukuoka_identity',state.identity);renderCloudStatus();closeSheet();toast('這支手機：'+state.identity);return}const addIt=e.target.closest('[data-add-itinerary]');if(addIt){const day=Number(addIt.dataset.addItinerary)||currentDay,title=document.getElementById('new-title').value.trim();if(!title)return toast('先幫這一站取個名字');const item={id:newCustomId(),day,groupIndex:Number(document.getElementById('new-group').value)||0,time:document.getElementById('new-time').value.trim(),title,note:document.getElementById('new-note').value.trim(),status:document.getElementById('new-status').value,location:document.getElementById('new-location').value.trim(),createdBy:state.identity,createdAt:Date.now()};state.itineraryCustom.push(item);await pushShared();closeSheet();renderDay();toast(cloudReady?'新行程已同步':'新行程已儲存在此手機');return}const saveIt=e.target.closest('[data-save-itinerary]');if(saveIt){const id=saveIt.dataset.saveItinerary,day=Number(saveIt.dataset.editDay)||currentDay,rec=getStepRecord(id,day);if(!rec)return toast('找不到這筆行程');const time=document.getElementById('edit-time').value.trim(),title=document.getElementById('edit-title').value.trim(),note=document.getElementById('edit-note').value.trim(),status=document.getElementById('edit-status').value,location=document.getElementById('edit-location').value.trim();if(!title)return toast('標題不能空白');state.itineraryEdits[id]={time,title,note,status,location};await pushShared();closeSheet();renderDay();renderNow();toast(cloudReady?'行程已同步':'已儲存在此手機');return}const resetIt=e.target.closest('[data-reset-itinerary]');if(resetIt){delete state.itineraryEdits[resetIt.dataset.resetItinerary];await pushShared();closeSheet();renderDay();renderNow();toast('已還原原始內容');return}const deleteIt=e.target.closest('[data-delete-itinerary]');if(deleteIt){if(deleteIt.dataset.confirm!=='yes'){deleteIt.dataset.confirm='yes';deleteIt.classList.add('confirming');deleteIt.textContent='再點一次，確定刪除';return}const id=deleteIt.dataset.deleteItinerary,day=Number(deleteIt.dataset.editDay)||currentDay;state.itineraryDeleted[id]=true;delete state.stepDone[id];await pushShared();closeSheet();renderDay();renderNow();toast('已移至刪除清單');return}const restoreIt=e.target.closest('[data-restore-itinerary]');if(restoreIt){delete state.itineraryDeleted[restoreIt.dataset.restoreItinerary];await pushShared();const day=Number(restoreIt.dataset.editDay)||currentDay;deletedItinerarySheet(day);renderDay();toast('行程已還原');return}if(e.target.closest('[data-save-expense]')){const amount=Number(document.getElementById('exp-amount').value),note=document.getElementById('exp-note').value.trim();if(!amount)return toast('請輸入金額');try{await addDoc(collection(db,'trips',TRIP_ID,'expenses'),{amount,note,payer:document.getElementById('exp-payer').value,category:document.getElementById('exp-cat').value,createdBy:state.identity,createdAt:serverTimestamp()});closeSheet();toast('支出已同步')}catch(err){toast('雲端連線失敗')}return}if(e.target.closest('[data-save-todo]')){const text=document.getElementById('todo-text').value.trim();if(!text)return toast('請輸入待辦');try{await addDoc(collection(db,'trips',TRIP_ID,'customTodos'),{text,done:false,createdBy:state.identity,createdAt:serverTimestamp()});closeSheet();toast('待辦已同步')}catch(err){toast('雲端連線失敗')}return}const del=e.target.closest('[data-delete-todo]');if(del){await deleteDoc(doc(db,'trips',TRIP_ID,'customTodos',del.dataset.deleteTodo));return}});
document.addEventListener('change',async e=>{if(!e.target.matches('[data-cloud-todo]'))return;try{await updateDoc(doc(db,'trips',TRIP_ID,'customTodos',e.target.dataset.cloudTodo),{done:e.target.checked,updatedBy:state.identity,updatedAt:serverTimestamp()})}catch(err){toast('同步失敗')}});
setInterval(()=>{renderNow();const td=tripDayFromDate(new Date());if(td&&td!==currentDay){currentDay=td;renderPills();renderDay()}},60000);
</script>
